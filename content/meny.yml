# MENY – eneste kilde for menyen på nettsiden, PDF-menyene og de strukturerte dataene.
# Lag aldri en kopi av menydata andre steder.
#
# Kilde: «sommer 2026.pdf». Norsk tekst er gjengitt slik den står på den trykte menyen.
#
# Felt:
#   id            unik id (små bokstaver, tall og bindestrek). Endres ikke uten grunn.
#   name, title   navn/overskrift per språk – norsk er påkrevd
#   description   valgfri beskrivelse per språk
#   note          valgfri merknad (seksjon: under overskriften, rett: ved navnet)
#   footnote      valgfri merknad etter seksjonen
#   price         pris i kroner (bare tall) – eller prices: [{ label: {...}, amount: 0 }]
#   allergens     koder fra allergenlista under, f.eks. [HG, M, E]
#   allergenNote  valgfri merknad til allergenene
#   web           true = vises på nettsiden. false = bare i PDF-menyen. Gjelder også undernivåer.
#   print         false = vises ikke i PDF-menyen (standard er true)
#
# TODO – allergener som skal avklares med restauranten:
#   - H står på de tre pastarettene sammen med D (durum). Allergenlista sier H = hasselnøtter. Hvete eller hasselnøtter?
#   - «Nøtter» er peanøtter, men er merket N (nøtter). Peanøtter er et eget allergen.
#   - Hvilke nøtter betyr N på burgerne og olivenene?

allergens:
  - code: HG
    name: { no: "hvetegluten", en: "wheat gluten" }
  - code: C
    name: { no: "cashewnøtter", en: "cashew nuts" }
  - code: P
    name: { no: "pinjekjerner", en: "pine nuts" }
  - code: M
    name: { no: "melk", en: "milk" }
  - code: Se
    name: { no: "selleri", en: "celery" }
  - code: Sk
    name: { no: "skalldyr", en: "shellfish" }
  - code: Sp
    name: { no: "sennep", en: "mustard" }
  - code: Ss
    name: { no: "sesam", en: "sesame" }
  - code: Su
    name: { no: "sulfitter", en: "sulphites" }
  - code: E
    name: { no: "egg", en: "egg" }
  - code: V
    name: { no: "valnøtter", en: "walnuts" }
  - code: N
    name: { no: "nøtter", en: "nuts" }
  - code: F
    name: { no: "Fisk", en: "fish" }
  - code: S
    name: { no: "Soya", en: "soy" }
